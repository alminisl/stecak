[package]
name = "stecak"
version = "0.2.19"
edition = "2024"
description = "A fast, lightweight GPU terminal emulator"
license = "MIT"
repository = "https://github.com/alminisl/stecak"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "gpu", "wgpu"]
categories = ["command-line-utilities"]

[dependencies]
winit = "0.30"
# Only the native backends: Metal (macOS), DX12 (Windows), Vulkan (+GL on Linux for old GPUs/VMs).
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "dx12", "vulkan"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
swash = "0.2"
memmap2 = "0.9"
# Background images: decoders only for common formats, to keep the binary small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# JPEG DCT-domain downscaling: decode a 6000px wallpaper at 1/4 size instead of full size.
jpeg-decoder = { version = "0.3", default-features = false }
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pollster = "0.4"
# Screen readers (UI Automation / NSAccessibility / AT-SPI). Inert until an assistive tool asks.
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
arboard = "3"
dirs = "6"
log = "0.4"
env_logger = "0.11"
# Sixel: finding escape sequences in PTY output (already in the tree via regex).
memchr = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
wgpu = { version = "30", default-features = false, features = ["gles"] }

# Native menus: the macOS menu bar, and right-click / "▾" popups on macOS and Windows.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
# Process snapshots: which program runs in a pane (agents, session restore).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Embeds the .exe icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
