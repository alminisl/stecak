[package]
name = "stecak"
version = "0.2.8"
edition = "2024"
description = "A fast, lightweight GPU terminal emulator"
license = "MIT"
repository = "https://github.com/alminisl/stecak"
readme = "README.md"
keywords = ["terminal", "terminal-emulator", "gpu", "wgpu"]
categories = ["command-line-utilities"]

[dependencies]
winit = "0.30"
# Only the native backends: Metal (macOS), DX12 (Windows), Vulkan (+GL on Linux for old GPUs/VMs).
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "dx12", "vulkan"] }
alacritty_terminal = "0.26"
portable-pty = "0.9"
swash = "0.2"
memmap2 = "0.9"
# Background images: decoders only for common formats, to keep the binary small.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# JPEG DCT-domain downscaling: decode a 6000px wallpaper at 1/4 size instead of full size.
jpeg-decoder = { version = "0.3", default-features = false }
fontdb = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
parking_lot = "0.12"
arboard = "3"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Native menu bar (Stećak / File / Edit / View / Window / Help).
muda = { version = "0.21", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
# Process snapshots: which program runs in a pane (agents, session restore).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

# Embeds the .exe icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
