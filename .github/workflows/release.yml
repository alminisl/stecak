name: Release

# Push a tag like v0.1.0 to build downloadable binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: sh scripts/bundle-macos.sh universal
      - run: sh scripts/make-dmg.sh "dist/Stecak-${GITHUB_REF_NAME}-macos-universal.dmg"
      - run: cd dist && ditto -c -k --keepParent "Stećak.app" "stecak-${GITHUB_REF_NAME}-macos-universal.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: cargo build --release
      - run: |
          mkdir -p dist/stecak
          cp target/release/stecak assets/stecak.desktop assets/icon-1024.png README.md LICENSE dist/stecak/
          tar -C dist -czf "dist/stecak-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" stecak
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  windows:
    name: windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          # Cross-compiled on the x64 runner (its Visual Studio has the ARM64 toolchain).
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Installer and zip
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          $exe = "target/${{ matrix.target }}/release/stecak.exe"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DExe=$($exe -replace '/', '\')" installer\stecak.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/stecak | Out-Null
          Copy-Item $exe, README.md, LICENSE, config.example.yaml dist/stecak/
          Compress-Archive -Path dist/stecak/* -DestinationPath "dist/stecak-$env:GITHUB_REF_NAME-windows-${{ matrix.arch }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*.zip
