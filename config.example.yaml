# Stećak config: copy to ~/.config/stecak/config.yaml (JSON works too). Changes apply on save.

font:
  family: ["JetBrainsMono Nerd Font Mono", "JetBrains Mono", "Menlo"]   # first installed wins
  size: 14
  line_height: 1.2
  ligatures: true

window:
  opacity: 0.85        # 0.0 – 1.0
  blur: true           # applied at startup
  padding: 8
  columns: 100
  rows: 30
  present_mode: mailbox  # mailbox | fifo | immediate

welcome: true             # a stećak and an inscription in the first tab at launch
check_for_updates: true   # ask GitHub for a newer release at startup (offers it; never auto-installs)
scrollback: 2000       # ~5 MB per 1,000 lines at 100 columns
option_as_alt: true    # macOS: Option sends Alt/Meta
paste_warning: true    # ask before pasting several lines into a program without bracketed paste
copy_on_select: false  # copy as soon as a mouse selection ends
cursor_blink: false    # blinks for 10 s after the last key press, then stays solid
visual_bell: false     # flash the pane on BEL

shell:
  program: ""          # empty = your default shell
  args: []

# PowerShell, cmd, WSL distros and Git Bash (/etc/shells on Unix) are detected automatically;
# open one from "▾" next to "+", with "New tab: …" in the command palette, or make it the default.
default_profile: ""    # e.g. "Ubuntu" or "Command Prompt"; empty = shell above
profiles:              # extra shells, or replace a detected one by using its name
  # - name: Ubuntu
  #   program: wsl.exe
  #   args: ["-d", "Ubuntu-24.04", "--cd", "~"]
  # - name: Projects
  #   program: pwsh.exe
  #   cwd: ~/Projects      # tabs from this profile start here

tabs:
  always_show: true

background_image:
  path: ""             # e.g. ~/Pictures/wall.jpg (png/jpg/webp)
  opacity: 1.0         # < 1 lets the desktop show through the image
  tint: 0.6            # theme background laid over the image
  fit: cover           # cover | contain | stretch | center

agent:                 # Cmd+Shift+A opens this in a split; Cmd+Shift+S browses sessions
  command: claude       # or codex
  notifications: true   # macOS notification when an agent needs you

bosancica:             # Cmd+Shift+B: draw text in the medieval Bosnian script
  enabled: false
  font: BoSanko2       # installed family, or a path to a .ttf/.otf (font not bundled; see README)
  size: 1.15
  weight: 0.4

colors:
  foreground: "#cdd6f4"
  background: "#1e1e2e"
  cursor: "#f5e0dc"
  tab_bar: "#181825"
  tab_active: "#313244"
  selection: "#585b70"
  search_match: "#f9e2af"
  search_current: "#fab387"
  palette: ["#45475a", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de",
            "#585b70", "#f38ba8", "#a6e3a1", "#f9e2af", "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8"]
